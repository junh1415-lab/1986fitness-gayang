<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>OT 신청 관리 | 1986피트니스 가양점</title>
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <header>
      <a href="../" class="brand"><img src="../assets/1986-fitness-logo.png" alt="" />1986 FITNESS</a>
      <button id="logout" class="secondary" hidden>로그아웃</button>
    </header>
    <main>
      <section id="login-view" class="login-card">
        <p class="eyebrow">PRIVATE ADMIN</p>
        <h1>OT 신청 관리</h1>
        <p>등록된 관리자 이메일로 로그인 링크를 보내드립니다.</p>
        <form id="login-form">
          <label>관리자 이메일<input type="email" name="email" value="junh1415@naver.com" required /></label>
          <button type="submit">로그인 링크 받기</button>
          <p id="login-message" role="status"></p>
        </form>
      </section>
      <section id="dashboard-view" hidden>
        <div class="dashboard-heading">
          <div><p class="eyebrow">GAYANG · OT DESK</p><h1>신청 내역</h1></div>
          <button id="refresh" class="secondary">새로고침</button>
        </div>
        <div class="summary"><strong id="new-count">0</strong><span>새 신청</span></div>
        <p id="list-message" role="status"></p>
        <div id="application-list" class="application-list"></div>
      </section>
    </main>
    <script type="module" src="admin.js"></script>
  </body>
</html>
